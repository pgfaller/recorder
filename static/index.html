<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recorder - Temperature & Humidity</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.2/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin-bottom: 24px; font-size: 28px; color: #333; }
    .controls { margin-bottom: 16px; }
    label { display: inline-block; font-weight: 500; color: #555; }
    select { padding: 8px 12px; margin-left: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    #chart { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recorder — Temperature & Humidity</h1>
    <div class="controls">
      <label for="range">Data points:</label>
      <select id="range" onchange="setRange()">
        <option value="100">100</option>
        <option value="250" selected>250</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>
    <div id="chart" style="width: 100%; height: 500px;"></div>
  </div>

  <script>
    let chartInstance = null;
    let currentRange = 250;

    function formatChartData(recordings) {
      if (!recordings || recordings.length === 0) return { times: [], temps: [], hums: [] };
      // Sort by timestamp ascending
      const sorted = recordings.slice().sort((a, b) => a[1] - b[1]);
      const times = sorted.map(r => new Date(r[1] * 1000).toLocaleString());
      const temps = sorted.map(r => r[2]);
      const hums = sorted.map(r => r[3]);
      return { times, temps, hums };
    }

    function drawChart() {
      fetch(`/data?limit=${currentRange}`)
        .then(r => r.json())
        .then(recordings => {
          const { times, temps, hums } = formatChartData(recordings);
          
          if (!chartInstance) {
            chartInstance = echarts.init(document.getElementById('chart'));
          }

          const option = {
            tooltip: { trigger: 'axis' },
            legend: { data: ['Temperature (°C)', 'Humidity (%)'] },
            xAxis: { 
              type: 'category',
              data: times,
              boundaryGap: false,
              splitLine: { show: false }
            },
            yAxis: [
              { type: 'value', name: 'Temperature (°C)', position: 'left', min: -10, max: 40 },
              { type: 'value', name: 'Humidity (%)', position: 'right', min: 0, max: 100 }
            ],
            series: [
              {
                name: 'Temperature (°C)',
                type: 'line',
                data: temps,
                yAxisIndex: 0,
                smooth: true,
                symbol: 'circle',
                symbolSize: 4,
                lineStyle: { color: '#FF6B6B', width: 2 }
              },
              {
                name: 'Humidity (%)',
                type: 'line',
                data: hums,
                yAxisIndex: 1,
                smooth: true,
                symbol: 'circle',
                symbolSize: 4,
                lineStyle: { color: '#4ECDC4', width: 2 }
              }
            ],
            grid: { containLabel: true }
          };

          chartInstance.setOption(option);
        })
        .catch(err => console.error('Error fetching data:', err));
    }

    function setRange() {
      currentRange = document.getElementById('range').value;
      drawChart();
    }

    document.addEventListener('DOMContentLoaded', drawChart);
    window.addEventListener('resize', () => chartInstance && chartInstance.resize());
  </script>
</body>
</html>
